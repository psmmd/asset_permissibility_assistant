name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      # Python version comes from .python-version; --locked fails if uv.lock is out of date.
      - run: uv sync --locked

      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Validate synthetic data
        run: uv run python scripts/validate_data.py

      # No secrets needed: tests fake the LLM and the database. The benchmark is run manually.
      - name: Tests
        run: uv run pytest
