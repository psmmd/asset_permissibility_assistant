name: CI

on:
  push:
  pull_request:

# Least privilege: the workflow only needs to read the code.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true

      # Python version comes from .python-version; --locked fails if uv.lock is out of date.
      - run: uv sync --locked

      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Validate synthetic data
        run: uv run python scripts/validate_data.py

      # No secrets needed: tests fake the LLM and the database. The benchmark is run manually.
      - name: Tests
        run: uv run pytest

      # Checks the image still builds (deployment builds it for ARM64, see infra/).
      - name: Docker build
        run: docker build -t asset-permissibility-assistant .
