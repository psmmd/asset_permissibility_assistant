<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Asset Permissibility Assistant</title>
<style>
  :root {
    --bg: #f7f7f5; --panel: #ffffff; --text: #1d1d1b; --muted: #6b6b66; --border: #e2e2dd;
    --accent: #2f5bea; --ok: #1f7a44; --ok-bg: #e5f4ea; --no: #b42318; --no-bg: #fdecea;
    --review: #9a5b00; --review-bg: #fff4e0;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #161615; --panel: #1f1f1d; --text: #ececea; --muted: #a0a09a; --border: #34342f;
      --accent: #7b9bff; --ok: #6fd39a; --ok-bg: #173323; --no: #ff8a80; --no-bg: #3a1a17;
      --review: #ffc266; --review-bg: #3a2c12;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 860px; margin: 0 auto; padding: 32px 16px 64px; }
  h1 { font-size: 1.5rem; margin: 0 0 4px; }
  .sub { color: var(--muted); margin: 0 0 24px; }
  .panel { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 20px; }
  textarea { width: 100%; min-height: 200px; padding: 12px; border: 1px solid var(--border); border-radius: 8px;
             background: var(--bg); color: var(--text); font: inherit; resize: vertical; }
  .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 12px; }
  button { font: inherit; border-radius: 8px; padding: 8px 14px; cursor: pointer; border: 1px solid var(--border);
           background: var(--panel); color: var(--text); }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
  button:disabled { opacity: .6; cursor: wait; }
  .examples-label { color: var(--muted); font-size: .875rem; margin-left: auto; }
  #result { margin-top: 20px; }
  .badge { display: inline-block; padding: 4px 12px; border-radius: 999px; font-weight: 700; font-size: .9rem; }
  .permissible { color: var(--ok); background: var(--ok-bg); }
  .not_permissible { color: var(--no); background: var(--no-bg); }
  .needs_review { color: var(--review); background: var(--review-bg); }
  .meta { color: var(--muted); font-size: .875rem; margin-left: 8px; }
  h2 { font-size: .8rem; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); margin: 20px 0 6px; }
  .rule { display: inline-block; font-family: ui-monospace, Menlo, monospace; font-size: .85rem;
          border: 1px solid var(--border); border-radius: 6px; padding: 2px 8px; margin: 0 6px 6px 0; }
  ul { margin: 0; padding-left: 20px; }
  details { margin-top: 20px; }
  summary { cursor: pointer; color: var(--muted); }
  pre { background: var(--bg); border: 1px solid var(--border); border-radius: 8px; padding: 12px;
        overflow-x: auto; font-size: .8rem; }
  .error { color: var(--no); }
</style>
</head>
<body>
<main>
  <h1>Asset Permissibility Assistant</h1>
  <p class="sub">Paste a request from a relationship manager. All rules and data are synthetic.</p>

  <div class="panel">
    <textarea id="text" placeholder="e.g. Client with a Luxembourg unit-linked policy wants to buy..."></textarea>
    <div class="row">
      <button class="primary" id="assess">Assess</button>
      <span class="examples-label">Examples:</span>
      <button data-example="0">Hedge fund</button>
      <button data-example="1">Crypto ETP</button>
      <button data-example="2">Missing info</button>
    </div>
  </div>

  <div id="result"></div>
</main>

<script>
const EXAMPLES = [
  `Hi,

re Mr Okafor - Luxembourg unit-linked, dedicated portfolio of around EUR 5m. The manager wants to add a Cayman long/short equity hedge fund (not UCITS) for EUR 400k, i.e. 8% of the portfolio. He already holds a private debt fund at 10%, so non-UCITS would go to 18% in total. He's a professional client (his bank's confirmation is on file from last year).

Ok?

Best,
Hanna`,
  `Hi team,

client holds a Luxembourg retirement policy and wants a bitcoin ETP (physically backed, listed on a regulated market in Germany) for 3% of the portfolio. She's a confirmed professional client; we have the bank's letter. I know we've done this for unit-linked clients before.

Thanks,
Julien`,
  `Hi, quick q:

Luxembourg unit-linked policy, client wants to add a global macro hedge fund (non-UCITS) for 10% of the portfolio. Nothing else alternative in there today. Can we approve?

Thanks
Katrin`,
];

const textEl = document.getElementById("text");
const resultEl = document.getElementById("result");
const assessBtn = document.getElementById("assess");

document.querySelectorAll("[data-example]").forEach(btn =>
  btn.addEventListener("click", () => { textEl.value = EXAMPLES[btn.dataset.example]; resultEl.innerHTML = ""; })
);

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

function render(a, seconds) {
  const label = { permissible: "Permissible", not_permissible: "Not permissible", needs_review: "Needs review" }[a.decision];
  const rules = a.rule_ids.length
    ? a.rule_ids.map(r => `<span class="rule">${escapeHtml(r)}</span>`).join("")
    : `<span class="meta">none</span>`;
  const missing = a.missing_info.length
    ? `<h2>Missing information</h2><ul>${a.missing_info.map(m => `<li>${escapeHtml(m)}</li>`).join("")}</ul>`
    : "";
  resultEl.innerHTML = `
    <div class="panel">
      <span class="badge ${a.decision}">${label}</span><span class="meta">${seconds.toFixed(1)}s</span>
      <h2>Rules</h2>${rules}
      <h2>Justification</h2><p>${escapeHtml(a.justification)}</p>
      ${missing}
      <details><summary>Extracted fields</summary><pre>${escapeHtml(JSON.stringify(a.extracted, null, 2))}</pre></details>
    </div>`;
}

assessBtn.addEventListener("click", async () => {
  const text = textEl.value.trim();
  if (!text) return;
  assessBtn.disabled = true;
  assessBtn.textContent = "Assessing…";
  resultEl.innerHTML = "";
  const start = performance.now();
  try {
    const res = await fetch("/assess", {
      method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ text }),
    });
    const body = await res.json();
    if (!res.ok) throw new Error(typeof body.detail === "string" ? body.detail : JSON.stringify(body.detail));
    render(body, (performance.now() - start) / 1000);
  } catch (err) {
    resultEl.innerHTML = `<div class="panel error">Error: ${escapeHtml(err.message)}</div>`;
  } finally {
    assessBtn.disabled = false;
    assessBtn.textContent = "Assess";
  }
});
</script>
</body>
</html>
